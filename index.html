<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros - IndexedDB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Librería Virtual</h1>
    <p class="author-credits">Desarrollado por: <strong>Jocelyn Astrid Arellano Aramburo</strong></p>

    <div class="container">
        <div class="formContainer">
            <label for="name">Título del Libro:</label>
            <input type="text" id="name" placeholder="Ej. El Principito">
            
            <label for="author">Autor:</label>
            <input type="text" id="author" placeholder="Ej. Antoine de Saint-Exupéry">
            
            <label for="price">Precio ($):</label>
            <input type="number" id="price" placeholder="Ej. 250" min="1">
            
            <button id="addBook">Agregar Libro</button>
        </div>

        <table id="booksTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="functions.js"></script>
</body>
</html>
